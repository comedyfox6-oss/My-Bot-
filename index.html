<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

    
    <meta charset="UTF-8">
    <title>Риан — живой разговор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #05060a;
            color: #fff;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #0b0c10;
            border-right: 1px solid #1a1b22;
            padding: 16px;
            box-sizing: border-box;
        }
        .avatar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .avatar img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3ddc84;
            display: inline-block;
            margin-left: 4px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            width: 100%;
            margin-bottom: 16px;
        }
        .chats-title {
            font-size: 13px;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .chat-item {
            padding: 8px;
            border-radius: 8px;
            background: #111827;
            font-size: 14px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #1a1b22;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header-name {
            font-weight: 600;
        }
        .chat-header-status {
            font-size: 12px;
            color: #9ca3af;
        }

        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #2563eb;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #111827;
        }

        .input-bar {
            padding: 10px 16px;
            border-top: 1px solid #1a1b22;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-bar input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #05060a;
            color: #fff;
            font-size: 14px;
        }
        .input-bar input[type="file"] {
            display: none;
        }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: none;
            background: #111827;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .settings {
            padding: 12px 16px;
            border-top: 1px solid #1a1b22;
            font-size: 12px;
            background: #05060a;
        }
        .settings label {
            display: block;
            margin-bottom: 4px;
        }
        .settings input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #0b0c10;
            color: #fff;
            font-size: 12px;
            box-sizing: border-box;
        }
        .settings .btn-save {
            margin-top: 8px;
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: none;
            background: #16a34a;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="avatar">
            <img src="https://via.placeholder.com/96x96.png?text=Риан" alt="Риан">
            <div>
                <div>Риан <span class="status-dot"></span></div>
                <div style="font-size:12px;color:#9ca3af;">экранный ассистент</div>
            </div>
        </div>
        <button class="btn btn-primary" id="newChatBtn">+ Новый чат</button>
        <div class="chats-title">Чаты</div>
        <div class="chat-item">Привет, робот!</div>
    </div>

    <div class="main">
        <div class="chat-header">
            <div class="chat-header-name">Риан</div>
            <div class="chat-header-status">онлайн</div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-bar">
            <button class="icon-btn" id="photoBtn">📎</button>
            <input id="photoInput" type="file" accept="image/*">
            <input id="textInput" type="text" placeholder="Напиши что-нибудь...">
            <button class="btn" id="sendBtn">Отправить</button>
        </div>

        <div class="settings">
            <label>GROQ API КЛЮЧ (НЕОБЯЗАТЕЛЬНО)</label>
            <input id="groqKeyInput" type="text" placeholder="sk_...">
            <button class="btn-save" id="saveSettingsBtn">Сохранить</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const photoBtn = document.getElementById('photoBtn');
        const photoInput = document.getElementById('photoInput');
        const groqKeyInput = document.getElementById('groqKeyInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        // загрузка ключа из localStorage
        groqKeyInput.value = localStorage.getItem('groq_api_key') || '';

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendToGroq(messages) {
            const apiKey = localStorage.getItem('groq_api_key');
            if (!apiKey) {
                // оффлайн-режим: просто эхо
                return "У меня нет GROQ ключа, так что я просто повторю: " +
                       messages[messages.length - 1].content;
            }

            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                },
                body: JSON.stringify({
                    model: 'llama3-70b-8192',
                    messages
                })
            });

            if (!res.ok) {
                return "Кажется, я в лимите или ключ не подходит. Код: " + res.status;
            }

            const data = await res.json();
            return data.choices[0].message.content;
        }

        sendBtn.onclick = async () => {
            const text = textInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            textInput.value = '';

            const reply = await sendToGroq([
                { role: 'user', content: text }
            ]);

            addMessage('assistant', reply);
        };

        photoBtn.onclick = () => {
            photoInput.click();
        };

        photoInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            addMessage('user', '[Фото: ' + file.name + ']');

            // здесь можно сделать отправку фото на свой backend
            // пока просто отвечаем заглушкой
            addMessage('assistant', 'Я пока не умею обрабатывать фото в этом клиенте, но могу отвечать на текст 😊');
        };

        saveSettingsBtn.onclick = () => {
            const key = groqKeyInput.value.trim();
            localStorage.setItem('groq_api_key', key);
            addMessage('assistant', 'Настройки сохранены. Могу пробовать писать через GROQ.');
        };

        // стартовое сообщение
        addMessage('assistant', 'Привет, я Риан. Напиши мне что-нибудь.');
    </script>
</body>
</html>
