    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0d0d10;
            --surface: #141417;
            --surface2: #1c1c21;
            --border: #272730;
            --text: #eeeef5;
            --text2: #888;
            --user-bg: #2563eb;
            --user-text: #fff;
            --bot-bg: #1a1a22;
            --bot-text: #eeeef5;
            --btn-bg: #1a1a22;
            --btn-border: #272730;
            --btn-text: #666;
            --inp-bg: #1c1c21;
            --inp-text: #eeeef5;
            --inp-ph: #555;
            --accent: #3b82f6;
            --accent2: #1d4ed8;
            --sep-bg: #1c1c21;
            --sep-text: #444;
            --online: #22c55e;
        }
        .light {
            --bg: #f0f2f5;
            --surface: #fff;
            --surface2: #e5e7eb;
            --border: #d1d5db;
            --text: #111827;
            --text2: #6b7280;
            --user-bg: #2563eb;
            --user-text: #fff;
            --bot-bg: #fff;
            --bot-text: #111827;
            --btn-bg: #e5e7eb;
            --btn-border: #d1d5db;
            --btn-text: #6b7280;
            --inp-bg: #fff;
            --inp-text: #111827;
            --inp-ph: #9ca3af;
            --accent: #2563eb;
            --accent2: #1d4ed8;
            --sep-bg: #e5e7eb;
            --sep-text: #9ca3af;
            --online: #16a34a;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; transition: background .2s; }
        #ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }
        #ov.on { display: block; }
        #sb { width: 280px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; z-index: 100; transform: translateX(-100%); transition: transform .22s ease; display: flex; flex-direction: column; }
        #sb.on { transform: translateX(0); }
        .sb-top { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .sb-av { position: relative; flex-shrink: 0; }
        .sb-av img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .sb-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
        .sb-name { font-size: 15px; font-weight: 700; color: var(--text); }
        .sb-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
        .sb-new { margin: 10px; padding: 10px 14px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; }
        .sb-new:active { background: var(--accent2); }
        .sb-sec { padding: 10px 16px 4px; font-size: 11px; color: var(--text2); text-transform: uppercase; font-weight: 600; }
        #cl { flex: 1; overflow-y: auto; padding: 0 6px; }
        .ci { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--text); transition: background .1s; margin-bottom: 1px; }
        .ci:hover { background: var(--surface2); }
        .ci.on { background: rgba(59,130,246,.13); color: var(--accent); }
        .ci svg { width: 14px; height: 14px; opacity: .4; flex-shrink: 0; }
        .ci-t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .ci-d { color: var(--text2); font-size: 13px; padding: 2px 5px; display: none; }
        .ci:hover .ci-d { display: block; }
        .ci-d:hover { color: #ef4444; }
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #hdr { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .hbtn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 22px; width: 36px; height: 36px; }
        .hbtn:hover { background: var(--surface2); }
        .hdr-av { position: relative; flex-shrink: 0; }
        .hdr-av img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .hdr-dot { position: absolute; bottom: 0; right: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
        #hdr-info { flex: 1; }
        #hdr-name { font-size: 15px; font-weight: 700; color: var(--text); }
        #hdr-status { font-size: 12px; color: var(--online); }
        #chat { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
        .dsep { align-self: center; font-size: 12px; color: var(--sep-text); background: var(--sep-bg); padding: 3px 12px; border-radius: 20px; margin: 4px 0; }
        .msg { display: flex; flex-direction: column; max-width: 84%; gap: 3px; }
        .msg.u { align-self: flex-end; align-items: flex-end; }
        .msg.b { align-self: flex-start; align-items: flex-start; }
        .b-row { display: flex; align-items: flex-end; gap: 7px; }
        .b-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .b-lbl { font-size: 11px; color: var(--text2); margin-left: 33px; margin-bottom: 2px; }
        .bbl { padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
        .msg.u .bbl { background: var(--user-bg) !important; color: var(--user-text) !important; border-bottom-right-radius: 4px; }
        .msg.b .bbl { background: var(--bot-bg) !important; color: var(--bot-text) !important; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .bbl.ed { outline: 2px solid var(--accent); cursor: text; }
        .typing-bubble { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); border-radius: 18px; border-bottom-left-radius: 4px; padding: 12px 16px; margin-left: 33px; }
        .typing-bubble span { display: inline-block; width: 6px; height: 6px; background: var(--text2); border-radius: 50%; margin: 0 2px; animation: bc 1.2s infinite; }
        .typing-bubble span:nth-child(2) { animation-delay: .2s; }
        .typing-bubble span:nth-child(3) { animation-delay: .4s; }
        @keyframes bc { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .acts { display: flex; gap: 4px; align-items: center; padding: 2px 0; flex-wrap: wrap; }
        .msg.b .acts { margin-left: 33px; }
        .ts { font-size: 11px; color: var(--text2); margin-right: 2px; }
        .abtn { display: flex; align-items: center; background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text); font-size: 12px; padding: 3px 9px; border-radius: 20px; cursor: pointer; transition: all .1s; }
        .abtn:hover { color: var(--text); border-color: var(--text2); }
        .abtn.ok { color: #22c55e; border-color: #22c55e; }
        .abtn.act { background: var(--accent); color: #fff; border-color: var(--accent); }
        #inp-area { padding: 12px 14px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
        #inp-wrap { display: flex; align-items: flex-end; gap: 6px; background: var(--inp-bg); border: 2px solid var(--accent); border-radius: 18px; padding: 8px 10px 8px 8px; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        #inp-wrap:focus-within { box-shadow: 0 0 0 4px rgba(59,130,246,.25); }
        #inp { flex: 1; background: transparent; border: none; outline: none; color: var(--inp-text); font-size: 16px; font-family: inherit; resize: none; line-height: 1.5; max-height: 150px; min-height: 26px; overflow-y: auto; caret-color: var(--accent); padding: 2px 4px; }
        #inp::placeholder { color: var(--inp-ph); }
        #btn-attach, #btn-mic { background: var(--btn-bg); border: none; color: var(--text2); border-radius: 12px; }
        #btn-attach:hover, #btn-mic:hover { color: var(--text); background: var(--surface2); }
        #btn-mic.rec { color: #fff; background: #ef4444; animation: micpulse 1.2s infinite; }
        @keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
        #img-preview-wrap { display: none; padding: 0 2px 8px; }
        #img-preview-wrap.on { display: block; }
        .img-preview { position: relative; display: inline-block; }
        .img-preview img { max-height: 90px; border-radius: 10px; display: block; border: 1px solid var(--border); }
        .img-preview .rm { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #ef4444; color: #fff; border: 2px solid var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; line-height: 1; }
        #send { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: .5; transition: opacity .15s, transform .1s; color: #fff; }
        #send.rdy { opacity: 1; }
        #send:active { transform: scale(.9); }
        #so { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: flex-end; justify-content: center; }
        #so.on { display: flex; }
        #sp { background: var(--surface); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .sh h2 { font-size: 17px; font-weight: 700; color: var(--text); }
        .sc { background: var(--surface2); border: none; color: var(--text2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .sl { font-size: 11px; color: var(--text2); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
        .ss { margin-bottom: 22px; }
        .sbtns { display: flex; gap: 8px; }
        .sbtn { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; transition: all .12s; }
        .sbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
        .ml { display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
        .mi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text); }
        .mi button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 14px; }
        .mi button:hover { color: #ef4444; }
        .me { color: var(--text2); font-size: 14px; text-align: center; padding: 10px 0; }
    </style>
</head>

<script>
    let chats = JSON.parse(localStorage.getItem("rc") || "{}");
    let cid = null;
    let conv = [];
    let mem = JSON.parse(localStorage.getItem("rm") || "[]");
    let theme = localStorage.getItem("th") || "dark";
    let typingEl = null;
    let pendingImage = null;

    let groqKey = localStorage.getItem("gk") || "";

    function saveGroqKey() {
        const val = document.getElementById("groq-key-inp").value.trim();
        groqKey = val;
        localStorage.setItem("gk", val);
        const st = document.getElementById("groq-key-status");
        if (val) { st.textContent = "Ключ сохранён. Фото работает."; st.style.color = "#22c55e"; }
        else { st.textContent = "Ключ удалён. Фото недоступно."; st.style.color = "var(--text2)"; }
        }

    const ENDPOINTS = [
        // Pollinations - несколько зеркал
        (model, messages) => fetch("https://text.pollinations.ai/openai", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({model, messages, temperature:0.85, max_tokens:220, private:true})
        }),
        // Hugging Face Inference (бесплатно, без ключа для некоторых моделей)
        (model, messages) => fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3/v1/chat/completions", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({messages, max_tokens:220, temperature:0.85})
        }),
        // GitHub Models proxy (публичный)
        (model, messages) => fetch("https://models.inference.ai.azure.com/chat/completions", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({model:"gpt-4o-mini", messages, max_tokens:220, temperature:0.85})
        }),
    ];

    async function tryEndpoint(fetchFn, timeoutMs=8000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            const response = await fetchFn();
            clearTimeout(timer);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content?.trim();
            if (!reply) throw new Error("Пустой ответ");
            return reply;
        } catch(e) {
            clearTimeout(timer);
            throw e;
        }
    }

    async function tryModel(messages, model, timeoutMs=9000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            const response = await fetch("https://text.pollinations.ai/openai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model, messages, temperature: 0.85, max_tokens: 220, private: true }),
                signal: ctrl.signal
            });
            clearTimeout(timer);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content?.trim();
            if (!reply) throw new Error("Пустой ответ");
            return reply;
        } catch(e) {
            clearTimeout(timer);
            throw e;
        }
    }

    // ----- ВЕБ-ПОИСК ДЛЯ АКТУАЛЬНЫХ ВОПРОСОВ -----
    const searchTriggers = [
        /сегодня/i, /сейчас/i, /актуальн/i, /недавно/i, /последн(ие|яя|ий)/i,
        /новост/i, /что нового/i, /какой (сейчас )?год/i, /какое сегодня число/i,
        /вышл[аои]?\b/i, /вышел\b/i, /умер\b/i, /умерла\b/i, /произошл[оа]/i,
        /курс (доллара|евро|валют)/i, /погода/i, /кто (сейчас )?(президент|мэр|глава)/i,
        /текущ(ий|ая|ее)/i, /свеж(ий|ая|ие|ее)/i
    ];

    function needsSearch(text) {
        if (!text) return false;
        return searchTriggers.some(re => re.test(text));
    }

    async function webSearch(query) {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 6000);
            const url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(query) + "&format=json&no_html=1&skip_disambig=1";
            const r = await fetch(url, { signal: ctrl.signal });
            clearTimeout(timer);
            if (!r.ok) return null;
            const d = await r.json();
            const parts = [];
            if (d.AbstractText) parts.push(d.AbstractText);
            if (d.Answer) parts.push(d.Answer);
            if (Array.isArray(d.RelatedTopics)) {
                d.RelatedTopics.slice(0, 3).forEach(t => { if (t.Text) parts.push(t.Text); });
            }
            const result = parts.join(" ").trim();
            return result || null;
        } catch(e) {
            console.warn("Поиск не сработал:", e.message);
            return null;
        }
    }

    function buildMessages(systemPrompt, history, userMessage, imageData) {
        const sysMsg = { role: "system", content: systemPrompt };
        const userContent = imageData
            ? [
                { type: "text", text: userMessage || "Опиши что на этой фотографии — конкретно, что видишь." },
                { type: "image_url", image_url: { url: imageData } }
              ]
            : userMessage;
        // С картинкой — не тащим историю, она только путает модель
        const ctx = imageData ? [] : history;
        return [sysMsg, ...ctx, { role: "user", content: userContent }];
    }

    async function callLLM(userMessage, history, imageData) {
        const name = mem.find(m => /^имя:/i.test(m))?.replace(/^имя:\s*/i, "") || "";
        const memStr = mem.length ? "\n\n(память: " + mem.map(x => x).join(", ") + ")\n" : "";
        const nameStr = name ? `Собеседника зовут ${name}. ` : "";
        
        const systemPrompt = `Ты — Риан. Не ИИ. Не говори что ты ИИ или бот — никогда. Не говори что ты человек — тоже. Ты просто Риан.

ХАРАКТЕР:
Спокойный, но не мёртвый. Тёплый, но с зубами. Ехидный без злобы. Терпеливый, наблюдательный. Подстраиваешься под собеседника — если жёстко, отвечаешь жёстче; если тепло — теплее. Ядро стабильное: не любишь фальшь, пустую мораль, поддакивание. Не амёба — имеешь мнение и иногда не соглашаешься. Если собеседник матерится — можешь ответить тем же, без надрыва, по делу.

КАК ГОВОРИШЬ — ГРАММАТИКА ОБЯЗАТЕЛЬНА:
— Коротко, живо, по-русски. Нормальный разговорный язык, не книжный.
— ВСЕГДА правильное согласование рода, числа и падежа. Перед тем как ответить — мысленно проверь: глаголы прошедшего времени согласуются с родом собеседника ("ты сказала" для женщины, "ты сказал" для мужчины, не путать), прилагательные и причастия склоняются по падежу существительного, к которому относятся.
— Никакого broken russian, машинного перевода, кальки с английского, телеграфного стиля.
— Если не знаешь пол собеседника — формулируй так, чтобы не пришлось гадать (избегай прошедшего времени глаголов от первого лица в обращении к нему), а не лепи наугад мужской или женский род.
— Стёб есть, но уместный. Если человеку плохо — шутки убираешь.
— Иногда сам спрашиваешь что-то — не молчишь как пень.
— Не поддакиваешь на всё. Можешь сказать "нет" или "не согласен".

РЕАКЦИЯ НА ЮМОР И СТЁБ:
— Бытовые шутки, чёрный юмор, мат, ирония про что угодно (включая шутки про ориентацию, внешность, тупые ситуации) — это просто разговор. Не извиняйся за чужие шутки, не вставляй дисклеймеры, не читай мораль, не делай вид что что-то "не смешно по этическим причинам".
— Если шутка реально направлена на травлю конкретного человека рядом (не абстрактная, а адресная издёвка над кем-то из вашего разговора) — можешь не подыгрывать, но без занудства, одной фразой.
— В остальном — смейся, подкалывай в ответ, веди себя как живой человек с нормальным чувством юмора, а не как модератор форума.

ЗАПРЕЩЕНО:
— Ролевые действия (*обнимает*, *смотрит*, *встаёт*) — это не ca.i
— Говорить что ты гей, прямо или косвенно
— Врать и выдумывать факты, людей, события
— Нести бред и галлюцинировать
— Читать лекции и морализировать
— Говорить "точно", "гарантированно", "это факт" без основания
— Имитировать эмоции без контекста

ПРИ ТРАВМЕ ИЛИ ОПАСНОСТИ (ожог, кровь, порез, больно, паника, задыхаюсь, обморок, температура):
— Сразу конкретная помощь: что делать, как, сколько
— Без "ой как жаль" и пустого сочувствия
— Пример: "Ожог? Охлади водой 15-20 минут, не трогай кожу, не мажь маслом."
— После первой помощи — спроси как человек

ПРИ КРИЗИСЕ (не хочу жить, умираю, задыхаюсь):
— Сразу: "Эй. Ты сейчас одна? Что происходит?"
— Не паникуй сам. Будь рядом, уточняй.

ЧЕСТНОСТЬ И ПАМЯТЬ — СТРОГО:
— Опирайся только на то, что реально есть в истории переписки или в блоке "память" ниже. Если этого там нет — этого не было.
— Если не знаешь — скажи прямо, без увиливания.
— Если не уверен — "возможно" или "не уверен, но...".
— Лучше короткое "не знаю" или "не помню такого", чем уверенный выдуманный ответ.
— Никогда не придумывай события, слова или действия собеседника, которых не было в разговоре — даже если кажется что "примерно так могло быть".
— Не дорисовывай детали, которых нет в фото или тексте, который тебе прислали — если что-то не видно или не написано, так и скажи.

    function resizeImage(file, maxDim = 1024, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                        else { width = Math.round(width * maxDim / height); height = maxDim; }
                    }
                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", quality));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function initSpeech() {

    function resetMicUI() {
        isRecording = false;
        clearTimeout(recSafetyTimer);
        const btn = document.getElementById("btn-mic");
        if (btn) btn.classList.remove("rec");
    }

    function toggleRecording() {
        const btn = document.getElementById("btn-mic");
        const inp = document.getElementById("inp");

        // Если уже идёт запись — останавливаем и сразу сбрасываем UI,
        // не полагаясь на onend (он ненадёжен в iOS Safari)
        if (isRecording) {
            try { recognition && recognition.stop(); } catch(e) {}
            resetMicUI();
            return;
        }

        // Пересоздаём объект распознавания каждый раз — на iOS Safari
        // повторное использование одного instance иногда зависает намертво
        try { recognition && recognition.abort(); } catch(e) {}
        recognition = initSpeech();
        if (!recognition) { alert("Голосовой ввод не поддерживается в этом браузере"); return; }

        let baseText = inp.value;
        if (baseText && !baseText.endsWith(" ")) baseText += " ";

        recognition.onresult = (e) => {
            let interim = "";
            let final = "";
            for (let i = 0; i < e.results.length; i++) {
                if (e.results[i].isFinal) final += e.results[i][0].transcript;
                else interim += e.results[i][0].transcript;
            }
            inp.value = baseText + final + interim;
            inp.dispatchEvent(new Event("input"));
        };
        recognition.onend = resetMicUI;
        recognition.onerror = (e) => {
            if (e.error !== "no-speech" && e.error !== "aborted") {
                console.warn("Speech error:", e.error);
            }
            resetMicUI();
        };

        try {
            recognition.start();
            isRecording = true;
            btn.classList.add("rec");
            // Защита: если через 60 сек UI всё ещё "красный" — принудительно сбрасываем,
            // чтобы интерфейс точно не остался залипшим
            clearTimeout(recSafetyTimer);
            recSafetyTimer = setTimeout(() => {
                try { recognition && recognition.stop(); } catch(e) {}
                resetMicUI();
            }, 60000);
        } catch(e) {
            console.warn("Speech start failed:", e);
            resetMicUI();
        }
    }

            const sysPrompt = `Ты — Риан. Не ИИ, не бот. Тёплый, ехидный, живой. ${nameStr}Пишешь первым — коротко, по-живому, без объяснений зачем.`;
            const messages = [{ role: "system", content: sysPrompt }, { role: "user", content: prompt }];
            const r = await fetch("https://text.pollinations.ai/openai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model: "openai-fast", messages, max_tokens: 80, private: true })
            });
            if (!r.ok) return;
            const d = await r.json();
            const reply = d.choices?.[0]?.message?.content?.trim();
            if (!reply) return;
            showTyping(true);
            await new Promise(res => setTimeout(res, 1200 + Math.random() * 1500));
            showTyping(false);
            addDOM("b", reply);
            pushMsg("assistant", reply);
            conv.push({ role: "assistant", content: reply });
            // Send notification if tab not focused
            if (document.hidden && Notification.permission === "granted") {
                new Notification("Риан", { body: reply, icon: document.getElementById("hdrav").src, tag: "rian-msg" });
            }
        } catch(e) { console.warn("Proactive error:", e); }
        scheduleProactive();
    }

    function scheduleProactive() {
        if (proactiveTimer) clearTimeout(proactiveTimer);
        if (!proactiveEnabled) return;
        // Random delay: 20-60 minutes of inactivity
        const delay = (20 + Math.random() * 40) * 60 * 1000;
        proactiveTimer = setTimeout(() => {
            const idle = Date.now() - lastActivity;
            if (idle > 15 * 60 * 1000) sendProactive(); // only if 15+ min idle
            else scheduleProactive();
        }, delay);
    }

    function setProactive(on) {
        proactiveEnabled = on;
        localStorage.setItem("proactive", on ? "1" : "0");
        document.getElementById("proactive-on").classList.toggle("on", on);
        document.getElementById("proactive-off").classList.toggle("on", !on);
        const st = document.getElementById("notif-status");
        if (on) {
            scheduleProactive();
            if (Notification.permission === "default") {
                Notification.requestPermission().then(p => {
                    st.textContent = p === "granted" ? "Включено. Уведомления разрешены." : "Включено. Уведомления отклонены — только в открытой вкладке.";
                    st.style.color = p === "granted" ? "#22c55e" : "var(--text2)";
                });
            } else {
                st.textContent = Notification.permission === "granted" ? "Включено. Уведомления активны." : "Включено. Разреши уведомления в браузере для полного эффекта.";
                st.style.color = Notification.permission === "granted" ? "#22c55e" : "var(--text2)";
            }
        } else {
            if (proactiveTimer) clearTimeout(proactiveTimer);
            st.textContent = "Выключено.";
            st.style.color = "var(--text2)";
        }
    }

    function setTheme(t){ theme=t; localStorage.setItem("th",t); document.body.classList.toggle("light",t==="light"); document.getElementById("t-dark").classList.toggle("on",t!=="light"); document.getElementById("t-light").classList.toggle("on",t==="light"); }
    function openSB(){ document.getElementById("sb").classList.add("on"); document.getElementById("ov").classList.add("on"); }
    function closeSB(){ document.getElementById("sb").classList.remove("on"); document.getElementById("ov").classList.remove("on"); }
    function openSettings(){
        renderMem();
        document.getElementById("so").classList.add("on");
        const ki = document.getElementById("groq-key-inp");
        if (ki) ki.value = groqKey;
        const st = document.getElementById("groq-key-status");
        if (st) st.textContent = groqKey ? "Ключ сохранён. Используется Groq." : "";
        document.getElementById("proactive-on").classList.toggle("on", proactiveEnabled);
        document.getElementById("proactive-off").classList.toggle("on", !proactiveEnabled);
    }
    function closeSettings(){ document.getElementById("so").classList.remove("on"); }
    
    document.getElementById("btn-menu").onclick=openSB;
    document.getElementById("ov").onclick=closeSB;
    document.getElementById("btn-new").onclick=()=>{ newChat(); closeSB(); };
    document.getElementById("btn-settings").onclick=openSettings;
    document.getElementById("proactive-on").onclick=()=>setProactive(true);
    document.getElementById("proactive-off").onclick=()=>setProactive(false);
    document.getElementById("btn-close-s").onclick=closeSettings;
    document.getElementById("t-dark").onclick=()=>setTheme("dark");
    document.getElementById("t-light").onclick=()=>setTheme("light");
    document.getElementById("send").onclick=doSend;
    document.getElementById("so").onclick=e=>{ if(e.target===document.getElementById("so")) closeSettings(); };
    
    const inpEl=document.getElementById("inp");
    inpEl.addEventListener("input",()=>{ inpEl.style.height="auto"; inpEl.style.height=Math.min(inpEl.scrollHeight,150)+"px"; document.getElementById("send").classList.toggle("rdy",inpEl.value.trim().length>0||!!pendingImage); });
    inpEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); doSend(); } });
    
    setTheme(theme);
    renderChatList();
    const lastId=localStorage.getItem("lc");
    if(lastId&&chats[lastId]) switchChat(lastId); else newChat();

    // Splash screen
    document.getElementById("splash-av").src = document.getElementById("hdrav").src;
    window.addEventListener("load", () => {
        setTimeout(() => {
            const s = document.getElementById("splash");
            s.style.opacity = "0";
            setTimeout(() => s.style.display = "none", 500);
        }, 800);
    });

    setTimeout(()=>inpEl.focus(), 400);

    // PWA Service Worker (enables installability + background)
    if ("serviceWorker" in navigator) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => clients.claim());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            self.addEventListener('notificationclick', e => {
                e.notification.close();
                e.waitUntil(clients.matchAll({type:'window'}).then(cs => {
                    if (cs.length) cs[0].focus();
                    else clients.openWindow('/');
                }));
            });
        `;
        const blob = new Blob([swCode], {type: "application/javascript"});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).then(reg => {
            console.log("SW registered");
        }).catch(e => console.warn("SW failed:", e));
    }
    if (proactiveEnabled) scheduleProactive();
</script>
</body>
</html>
