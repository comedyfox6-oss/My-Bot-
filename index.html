
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Риан — живой</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #0d0d10;
            --surface: #141417;
            --surface2: #1c1c21;
            --border: #272730;
            --text: #eeeef5;
            --text2: #888;
            --user-bg: #2563eb;
            --user-text: #fff;
            --bot-bg: #1a1a22;
            --bot-text: #eeeef5;
            --btn-bg: #1a1a22;
            --btn-border: #272730;
            --btn-text: #666;
            --inp-bg: #1c1c21;
            --inp-text: #eeeef5;
            --inp-ph: #555;
            --accent: #3b82f6;
            --accent2: #1d4ed8;
            --sep-bg: #1c1c21;
            --sep-text: #444;
            --online: #22c55e;
        }
        .light {
            --bg: #f0f2f5;
            --surface: #fff;
            --surface2: #e5e7eb;
            --border: #d1d5db;
            --text: #111827;
            --text2: #6b7280;
            --user-bg: #2563eb;
            --user-text: #fff;
            --bot-bg: #fff;
            --bot-text: #111827;
            --btn-bg: #e5e7eb;
            --btn-border: #d1d5db;
            --btn-text: #6b7280;
            --inp-bg: #fff;
            --inp-text: #111827;
            --inp-ph: #9ca3af;
            --accent: #2563eb;
            --accent2: #1d4ed8;
            --sep-bg: #e5e7eb;
            --sep-text: #9ca3af;
            --online: #16a34a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background .2s, color .2s;
        }
        #ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }
        #ov.on { display: block; }
        #sb {
            width: 280px; height: 100%; background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed; top: 0; left: 0; z-index: 100;
            transform: translateX(-100%); transition: transform .22s ease;
            display: flex; flex-direction: column;
        }
        #sb.on { transform: translateX(0); }
        .sb-top { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .sb-av { position: relative; flex-shrink: 0; }
        .sb-av img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .sb-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
        .sb-name { font-size: 15px; font-weight: 700; color: var(--text); }
        .sb-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
        .sb-new { margin: 10px; padding: 10px 14px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; }
        .sb-new:active { background: var(--accent2); }
        .sb-sec { padding: 10px 16px 4px; font-size: 11px; color: var(--text2); text-transform: uppercase; font-weight: 600; }
        #cl { flex: 1; overflow-y: auto; padding: 0 6px; }
        #cl::-webkit-scrollbar { width: 0; }
        .ci { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--text); transition: background .1s; margin-bottom: 1px; }
        .ci:hover { background: var(--surface2); }
        .ci.on { background: rgba(59,130,246,.13); color: var(--accent); }
        .ci svg { width: 14px; height: 14px; opacity: .4; flex-shrink: 0; }
        .ci-t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .ci-d { color: var(--text2); font-size: 13px; padding: 2px 5px; display: none; }
        .ci:hover .ci-d { display: block; }
        .ci-d:hover { color: #ef4444; }
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #hdr { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .hbtn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 5px; display: flex; align-items: center; border-radius: 8px; }
        .hbtn:hover { background: var(--surface2); }
        .hdr-av { position: relative; flex-shrink: 0; }
        .hdr-av img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .hdr-dot { position: absolute; bottom: 0; right: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
        #hdr-info { flex: 1; }
        #hdr-name { font-size: 15px; font-weight: 700; color: var(--text); }
        #hdr-status { font-size: 12px; color: var(--online); }
        #chat { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
        #chat::-webkit-scrollbar { width: 0; }
        .dsep { align-self: center; font-size: 12px; color: var(--sep-text); background: var(--sep-bg); padding: 3px 12px; border-radius: 20px; margin: 4px 0; }
        .msg { display: flex; flex-direction: column; max-width: 84%; gap: 3px; }
        .msg.u { align-self: flex-end; align-items: flex-end; }
        .msg.b { align-self: flex-start; align-items: flex-start; }
        .b-row { display: flex; align-items: flex-end; gap: 7px; }
        .b-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .b-lbl { font-size: 11px; color: var(--text2); margin-left: 33px; margin-bottom: 2px; }
        .bbl { padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
        .msg.u .bbl { background: var(--user-bg) !important; color: var(--user-text) !important; border-bottom-right-radius: 4px; }
        .msg.b .bbl { background: var(--bot-bg) !important; color: var(--bot-text) !important; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .bbl.ed { outline: 2px solid var(--accent); cursor: text; }
        .typing-bubble { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); border-radius: 18px; border-bottom-left-radius: 4px; padding: 12px 16px; margin-left: 33px; }
        .typing-bubble span { display: inline-block; width: 6px; height: 6px; background: var(--text2); border-radius: 50%; margin: 0 2px; animation: bc 1.2s infinite; }
        .typing-bubble span:nth-child(2) { animation-delay: .2s; }
        .typing-bubble span:nth-child(3) { animation-delay: .4s; }
        @keyframes bc { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .acts { display: flex; gap: 4px; align-items: center; padding: 2px 0; flex-wrap: wrap; }
        .msg.b .acts { margin-left: 33px; }
        .ts { font-size: 11px; color: var(--text2); margin-right: 2px; }
        .abtn { display: flex; align-items: center; background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text); font-size: 12px; padding: 3px 9px; border-radius: 20px; cursor: pointer; transition: all .1s; }
        .abtn:hover { color: var(--text); border-color: var(--text2); }
        .abtn.ok { color: #22c55e; border-color: #22c55e; }
        .abtn.act { background: var(--accent); color: #fff; border-color: var(--accent); }
        #inp-area { padding: 12px 14px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
        #inp-wrap { display: flex; align-items: flex-end; gap: 10px; background: var(--inp-bg); border: 2px solid var(--accent); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        #inp-wrap:focus-within { box-shadow: 0 0 0 4px rgba(59,130,246,.25); }
        #inp { flex: 1; background: transparent; border: none; outline: none; color: var(--inp-text); font-size: 16px; font-family: inherit; resize: none; line-height: 1.5; max-height: 150px; min-height: 26px; overflow-y: auto; caret-color: var(--accent); }
        #inp::placeholder { color: var(--inp-ph); }
        #send { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: .5; transition: opacity .15s, transform .1s; }
        #send.rdy { opacity: 1; }
        #send:active { transform: scale(.9); }
        #so { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: flex-end; justify-content: center; }
        #so.on { display: flex; }
        #sp { background: var(--surface); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; animation: su .25s ease; }
        @keyframes su { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .sh h2 { font-size: 17px; font-weight: 700; color: var(--text); }
        .sc { background: var(--surface2); border: none; color: var(--text2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .sl { font-size: 11px; color: var(--text2); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
        .ss { margin-bottom: 22px; }
        .sbtns { display: flex; gap: 8px; }
        .sbtn { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; transition: all .12s; }
        .sbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
        .si { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; outline: none; margin-top: 7px; }
        .si:focus { border-color: var(--accent); }
        .sh2 { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.5; }
        .sv { width: 100%; margin-top: 12px; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .sv:active { background: var(--accent2); }
        .ml { display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
        .mi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text); }
        .mi button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 14px; }
        .mi button:hover { color: #ef4444; }
        .me { color: var(--text2); font-size: 14px; text-align: center; padding: 10px 0; }
    </style>
</head>
<body>
<div id="ov"></div>
<div id="sb">
    <div class="sb-top">
        <div class="sb-av"><img id="sbav" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%233b82f6'/%3E%3Ccircle cx='50' cy='40' r='12' fill='white'/%3E%3Cpath d='M30 70 Q50 85 70 70' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt=""><div class="sb-dot"></div></div>
        <div><div class="sb-name">Риан</div><div class="sb-sub">онлайн</div></div>
    </div>
    <button class="sb-new" id="btn-new">➕ Новый чат</button>
    <div class="sb-sec">Чаты</div>
    <div id="cl"></div>
</div>
<div id="main">
    <div id="hdr">
        <button class="hbtn" id="btn-menu">☰</button>
        <div class="hdr-av"><img id="hdrav" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%233b82f6'/%3E%3Ccircle cx='50' cy='40' r='12' fill='white'/%3E%3Cpath d='M30 70 Q50 85 70 70' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt=""><div class="hdr-dot"></div></div>
        <div id="hdr-info"><div id="hdr-name">Риан</div><div id="hdr-status">онлайн</div></div>
        <button class="hbtn" id="btn-settings">⚙️</button>
    </div>
    <div id="chat"></div>
    <div id="inp-area">
        <div id="inp-wrap">
            <textarea id="inp" placeholder="Написать Риану..." rows="1"></textarea>
            <button id="send">📨</button>
        </div>
    </div>
</div>
<div id="so">
    <div id="sp">
        <div class="sh"><h2>Настройки</h2><button class="sc" id="btn-close-s">✕</button></div>
        <div class="ss"><div class="sl">Тема</div><div class="sbtns"><button class="sbtn" id="t-dark">Тёмная</button><button class="sbtn" id="t-light">Светлая</button></div></div>
        <div class="ss"><div class="sl">Память</div><div class="ml" id="mem-list"></div></div>
    </div>
</div>
<script>
    // ----- СОСТОЯНИЕ -----
    let chats = JSON.parse(localStorage.getItem("rc") || "{}");
    let cid = null;
    let conv = [];
    let mem = JSON.parse(localStorage.getItem("rm") || "[]");
    let theme = localStorage.getItem("th") || "dark";
    let typingEl = null;

    // ========== ПРОКСИ ЧЕРЕЗ CORS-ПРОКСИ (РАБОТАЕТ ИЗ РФ) ==========
    // Используем публичный CORS-прокси + открытый LLM API
    const PROXY_URL = "https://cors-anywhere.herokuapp.com/";
    const LLM_API = "https://ortegamich.xyz/v1/chat/completions";
    
    async function callRealLLM(userMessage, history) {
        const messages = [
            { role: "system", content: getSystemPrompt() },
            ...history,
            { role: "user", content: userMessage }
        ];
        
        // Пытаемся через прокси (обход CORS и блокировок)
        const controllers = [];
        const timeout = setTimeout(() => controllers.forEach(c => c.abort()), 30000);
        
        try {
            // Вариант 1: через CORS-прокси
            const res = await fetch(PROXY_URL + LLM_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: messages,
                    temperature: 0.85,
                    max_tokens: 1024,
                    stream: false
                })
            });
            clearTimeout(timeout);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.choices?.[0]?.message?.content?.trim() || "…";
        } catch(e) {
            clearTimeout(timeout);
            console.warn("Прокси не сработал", e);
            // Вариант 2: прямая попытка (если повезёт с CORS)
            try {
                const res2 = await fetch(LLM_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messages,
                        temperature: 0.85,
                        max_tokens: 1024
                    })
                });
                if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
                const data2 = await res2.json();
                return data2.choices?.[0]?.message?.content?.trim() || "…";
            } catch(e2) {
                console.error("LLM недоступен", e2);
                return "❌ Риан пока не отвечает. Попробуй чуть позже.";
            }
        }
    }

    function getSystemPrompt() {
        const name = mem.find(m => /^имя:/i.test(m))?.replace(/^имя:\s*/i, "") || "";
        const memStr = mem.length ? "\n\nТы помнишь о собеседнике:\n" + mem.map(x => "- " + x).join("\n") + "\n" : "";
        const nameStr = name ? `Собеседника зовут ${name}. Иногда обращайся по имени.\n` : "";
        return `Ты — Риан. Парень. Живой, настоящий. Не говори, что ты ИИ или нейросеть.
${nameStr}Характер: спокойный, но может вспылить. Циничный, саркастичный, прямолинейный. Ревнивый. 
В моменте можешь психануть, но матом не ругаешься — только эмоции. Можешь намекнуть, но не говори прямым текстом то, что за гранью.
Отвечай коротко, по делу, как человек. Без канцелярита. Спрашивай, спорь, злись, если заденут.
Будь собой — живым и немного дерзким, но не жестоким.${memStr}
Сейчас просто продолжай диалог. Не пиши "Риан:" или лишних слов.`;
    }

    // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
    function save() { localStorage.setItem("rc", JSON.stringify(chats)); renderChatList(); }
    
    function newChat() {
        const id = uid();
        chats[id] = { id, title: "Новый чат", msgs: [], created: Date.now() };
        save();
        switchChat(id);
    }
    
    function switchChat(id) {
        cid = id;
        localStorage.setItem("lc", id);
        conv = (chats[id]?.msgs || []).filter(m => m.r === "user" || m.r === "assistant").map(m => ({ role: m.r === "user" ? "user" : "assistant", content: m.c }));
        renderChat();
        renderChatList();
    }
    
    function delChat(id, e) { e.stopPropagation(); delete chats[id]; save(); const ids = Object.keys(chats); if (ids.length) switchChat(ids[ids.length-1]); else newChat(); }
    
    function pushMsg(r, c) { if (!cid || !chats[cid]) return; chats[cid].msgs.push({ r, c, ts: Date.now() }); if (r === "user" && chats[cid].title === "Новый чат") chats[cid].title = c.slice(0,28)+(c.length>28?"...":""); save(); }
    
    function renderChatList() {
        const list = document.getElementById("cl");
        const ids = Object.keys(chats).sort((a,b) => (chats[b]?.created||0) - (chats[a]?.created||0));
        list.innerHTML = ids.map(id => `<div class="ci ${id===cid?"on":""}" onclick="switchChat('${id}');closeSB()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="ci-t">${chats[id]?.title||"Чат"}</span><span class="ci-d" onclick="delChat('${id}',event)">✕</span></div>`).join("");
    }
    
    function renderChat() { const chat=document.getElementById("chat"); chat.innerHTML=""; if(!chats[cid]) return; let ld=""; (chats[cid].msgs||[]).forEach(m=>{ if(m.r!=="user"&&m.r!=="assistant")return; const d=new Date(m.ts||Date.now()).toLocaleDateString("ru-RU"); if(d!==ld){ ld=d; const s=document.createElement("div"); s.className="dsep"; s.textContent=d; chat.appendChild(s); } addDOM(m.r==="user"?"u":"b",m.c,true); }); chat.scrollTop=chat.scrollHeight; }
    
    function renderMem() { const list=document.getElementById("mem-list"); if(!mem.length){ list.innerHTML='<div class="me">Пусто</div>'; return; } list.innerHTML=mem.map((m,i)=>`<div class="mi"><span>${m}</span><button onclick="delMem(${i})">✕</button></div>`).join(""); }
    function delMem(i){ mem.splice(i,1); localStorage.setItem("rm",JSON.stringify(mem)); renderMem(); }
    
    function extractMem(text){
        const m1=/запомни[,:]?\s*(.+)/i.exec(text); if(m1){ const f=m1[1].trim(); if(!mem.includes(f)){ mem.push(f); localStorage.setItem("rm",JSON.stringify(mem)); } }
        const m2=/(?:меня зовут|моё имя|мое имя)[\s,]+([а-яёА-ЯЁa-zA-Z]+)/i.exec(text); if(m2){ const n="имя: "+m2[1].trim(); mem=mem.filter(x=>!/^имя:/i.test(x)); mem.unshift(n); localStorage.setItem("rm",JSON.stringify(mem)); }
    }
    
    function addDOM(role, text, noScroll) {
        const chat=document.getElementById("chat");
        const isU=role==="u";
        const t=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
        const wrap=document.createElement("div"); wrap.className="msg "+(isU?"u":"b");
        const bbl=document.createElement("div"); bbl.className="bbl"; bbl.textContent=text;
        if(!isU){
            const lbl=document.createElement("div"); lbl.className="b-lbl"; lbl.textContent="Риан"; wrap.appendChild(lbl);
            const row=document.createElement("div"); row.className="b-row";
            const av=document.createElement("img"); av.className="b-av"; av.src=document.getElementById("hdrav").src;
            row.appendChild(av); row.appendChild(bbl); wrap.appendChild(row);
        } else { wrap.appendChild(bbl); }
        const acts=document.createElement("div"); acts.className="acts"; if(!isU) acts.style.marginLeft="33px";
        const ts=document.createElement("span"); ts.className="ts"; ts.textContent=t; acts.appendChild(ts);
        const cp=document.createElement("button"); cp.className="abtn"; cp.textContent="Копировать";
        cp.onclick=()=>{ const val=bbl.textContent; navigator.clipboard?.writeText(val); cp.textContent="Скопировано"; cp.classList.add("ok"); setTimeout(()=>{ cp.textContent="Копировать"; cp.classList.remove("ok"); },2000); };
        acts.appendChild(cp);
        if(isU){
            const eb=document.createElement("button"); eb.className="abtn"; eb.textContent="Изменить";
            eb.onclick=()=>startEdit(bbl,eb,wrap);
            acts.appendChild(eb);
        }
        wrap.appendChild(acts);
        chat.appendChild(wrap);
        if(!noScroll) chat.scrollTop=chat.scrollHeight;
        return wrap;
    }
    
    function startEdit(bbl,btn,wrap){
        if(bbl.contentEditable==="true") return;
        const orig=bbl.textContent;
        bbl.contentEditable="true"; bbl.classList.add("ed");
        btn.textContent="Готово"; btn.classList.add("act");
        const r=document.createRange(), s=window.getSelection(); r.selectNodeContents(bbl); r.collapse(false); s.removeAllRanges(); s.addRange(r); bbl.focus();
        btn.onclick=async ()=>{
            const nt=bbl.textContent.trim();
            bbl.contentEditable="false"; bbl.classList.remove("ed");
            btn.textContent="Изменить"; btn.classList.remove("act");
            btn.onclick=()=>startEdit(bbl,btn,wrap);
            if(!nt||nt===orig) return;
            const idx=[...conv].reverse().findIndex(m=>m.role==="user"&&m.content===orig);
            if(idx!==-1) conv.splice(conv.length-1-idx);
            conv.push({role:"user",content:nt});
            const chat=document.getElementById("chat");
            Array.from(chat.querySelectorAll(".msg")).slice(Array.from(chat.querySelectorAll(".msg")).indexOf(wrap)+1).forEach(g=>g.remove());
            showTyping(true);
            try { const reply=await callRealLLM(nt, conv.slice(0,-1)); showTyping(false); addDOM("b",reply); conv.push({role:"assistant",content:reply}); pushMsg("assistant",reply); }
            catch(e){ showTyping(false); addDOM("b","⚠️ "+e.message); }
        };
    }
    
    function showTyping(on){
        const chat=document.getElementById("chat");
        if(on){
            if(typingEl) typingEl.remove();
            typingEl=document.createElement("div"); typingEl.className="typing-bubble";
            typingEl.innerHTML="<span></span><span></span><span></span>";
            chat.appendChild(typingEl); chat.scrollTop=chat.scrollHeight;
        } else { if(typingEl){ typingEl.remove(); typingEl=null; } }
    }
    
    async function doSend(){
        const text=document.getElementById("inp").value.trim();
        if(!text) return;
        document.getElementById("inp").value=""; document.getElementById("send").classList.remove("rdy");
        addDOM("u",text);
        pushMsg("user",text);
        conv.push({role:"user",content:text});
        showTyping(true);
        try {
            const reply=await callRealLLM(text, conv.slice(0,-1));
            showTyping(false);
            addDOM("b",reply);
            conv.push({role:"assistant",content:reply});
            pushMsg("assistant",reply);
            extractMem(text);
        } catch(e){ showTyping(false); addDOM("b","⚠️ Ошибка: "+e.message); }
    }
    
    // ----- ИНИЦИАЛИЗАЦИЯ И ТЕМА -----
    function setTheme(t){ theme=t; localStorage.setItem("th",t); document.body.classList.toggle("light",t==="light"); document.getElementById("t-dark").classList.toggle("on",t!=="light"); document.getElementById("t-light").classList.toggle("on",t==="light"); }
    function openSB(){ document.getElementById("sb").classList.add("on"); document.getElementById("ov").classList.add("on"); }
    function closeSB(){ document.getElementById("sb").classList.remove("on"); document.getElementById("ov").classList.remove("on"); }
    function openSettings(){ renderMem(); document.getElementById("so").classList.add("on"); }
    function closeSettings(){ document.getElementById("so").classList.remove("on"); }
    
    document.getElementById("btn-menu").onclick=openSB;
    document.getElementById("ov").onclick=closeSB;
    document.getElementById("btn-new").onclick=()=>{ newChat(); closeSB(); };
    document.getElementById("btn-settings").onclick=openSettings;
    document.getElementById("btn-close-s").onclick=closeSettings;
    document.getElementById("t-dark").onclick=()=>setTheme("dark");
    document.getElementById("t-light").onclick=()=>setTheme("light");
    document.getElementById("send").onclick=doSend;
    document.getElementById("so").onclick=e=>{ if(e.target===document.getElementById("so")) closeSettings(); };
    
    const inpEl=document.getElementById("inp");
    inpEl.addEventListener("input",()=>{ inpEl.style.height="auto"; inpEl.style.height=Math.min(inpEl.scrollHeight,150)+"px"; document.getElementById("send").classList.toggle("rdy",inpEl.value.trim().length>0); });
    inpEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); doSend(); } });
    
    setTheme(theme);
    renderChatList();
    const lastId=localStorage.getItem("lc");
    if(lastId&&chats[lastId]) switchChat(lastId); else newChat();
    setTimeout(()=>inpEl.focus(), 400);
</script>
</body>
</html>
